name: Engine builds and isolated tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TETHERMAX_TOOLS: ${{ github.workspace }}/.ci-tools
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.1'
          cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
      - name: Prepare pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Real Java to Go loopback transport tests
        run: scripts/test.sh
      - name: Build and verify APK
        run: scripts/build-android.sh
      - name: Cross-compile Windows applications
        run: scripts/build-host.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tethermax-engine-preview
          path: |
            build/artifacts/*
            build/reports/*
          if-no-files-found: error
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      TETHERMAX_TOOLS: ${{ github.workspace }}/.ci-tools
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.1'
          cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
      - name: Native Windows tests with Java peer; loopback only
        shell: bash
        run: scripts/test.sh
      - name: Build native Windows executable and check safe default
        shell: pwsh
        run: |
          Push-Location host
          go build -trimpath -o ../build/tethermax-native.exe ./cmd/tethermax
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          ./build/tethermax-native.exe status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/tethermax-native.exe serve
          if ($LASTEXITCODE -ne 1) { throw 'Physical test safety gate failed' }
          exit 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-native-test-report
          path: build/reports/go-test.txt
          if-no-files-found: error
