name: Smart Network isolated validation
on:
  push:
    branches: [codex/ultimate-smart-network-rc13]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loopback-and-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TETHERMAX_TOOLS: ${{ github.workspace }}/.ci-tools
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/test.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: smart-network-race
          path: build/reports/go-test.txt
  windows-offline:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Offline accounting, lifecycle and UI
        shell: pwsh
        run: |
          dotnet run --project windows/TetherMax.SmartNetworkTests -c Release
          if($LASTEXITCODE){throw 'Smart Network tests failed'}
          dotnet run --project windows/TetherMax.GameTests -c Release
          if($LASTEXITCODE){throw 'Game tests failed'}
          dotnet run --project windows/TetherMax.ConnectionTests -c Release
          if($LASTEXITCODE){throw 'Connection tests failed'}
          dotnet build windows/TetherMax.Desktop -c Release -o build/offline-ui
          if($LASTEXITCODE){throw 'Desktop build failed'}
          & build/offline-ui/TetherMax.exe --ui-self-test
          if($LASTEXITCODE){throw 'UI tests failed'}
