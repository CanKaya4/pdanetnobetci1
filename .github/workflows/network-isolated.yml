name: Isolated Windows routing and crash recovery
on:
  push:
    branches: [tethermax-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ephemeral-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Offline process faults and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/engine-classes,build/reports | Out-Null
          $sources=Get-ChildItem engine/src,engine/test -Recurse -Filter *.java | ForEach-Object FullName
          javac --release 8 -Xlint:all,-options -Werror -d build/engine-classes $sources
          if($LASTEXITCODE){throw 'Java build failed'}
          dotnet run --project windows/TetherMax.NetworkTests -c Release
          if($LASTEXITCODE){throw 'Offline network tests failed'}
          dotnet publish windows/TetherMax.Network -c Release -r win-x64 --self-contained true -o build/windows-network
          if($LASTEXITCODE){throw 'Guardian build failed'}
          dotnet build windows/TetherMax.Desktop -c Release
          if($LASTEXITCODE){throw 'Desktop build failed'}
          Push-Location host
          try { go build -trimpath -o ../build/windows-network/tethermax-engine.exe ./cmd/tethermax; if($LASTEXITCODE){throw 'Worker build failed'} } finally {Pop-Location}
      - name: Verify official Wintun without changing runner network yet
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile build/wintun.zip
          if((Get-FileHash build/wintun.zip).Hash -ne '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51'){throw 'Archive checksum mismatch'}
          Expand-Archive build/wintun.zip build/wintun
          Copy-Item build/wintun/wintun/bin/amd64/wintun.dll build/windows-network/wintun.dll
          if((Get-FileHash build/windows-network/wintun.dll).Hash -ne 'E5DA8447DC2C320EDC0FC52FA01885C103DE8C118481F683643CACC3220DAFCE'){throw 'DLL checksum mismatch'}
          if((Get-AuthenticodeSignature build/windows-network/wintun.dll).Status -ne 'Valid'){throw 'Official signature invalid'}
      - name: Actual Wintun, WFP, Windows DNS and independent crash rollback
        shell: pwsh
        run: |
          # This job is the disposable test machine. All remote traffic generated
          # by this test maps to a loopback-only Java fixture, never a phone.
          dotnet run --project windows/TetherMax.NetworkTests -c Release -- --native-isolated-runner 2>&1 | Tee-Object build/reports/native-network.txt
          if($LASTEXITCODE){throw 'Native isolated tests failed; inspect recovery report'}
      - name: Preserve disposable VM recovery evidence
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:ProgramData/TetherMax-Network-*" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $target=Join-Path 'build/reports' $_.Name
            New-Item -ItemType Directory -Force $target | Out-Null
            Get-ChildItem -LiteralPath $_.FullName -File | Where-Object {$_.Extension -in '.json','.jsonl','.log','.txt'} | ForEach-Object {Copy-Item -LiteralPath $_.FullName -Destination $target}
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: isolated-native-network-results
          path: build/reports/*
          if-no-files-found: warn
